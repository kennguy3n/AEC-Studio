[package]
name = "aec_render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native render core: CPU/GPU path tracer, BVH, BSDF, denoiser, scheduler, PBR preview, walkthrough, panorama, presets."

[dependencies]
aec_core = { path = "../aec_core" }
aec_audit = { path = "../aec_audit" }
aec_geometry = { path = "../aec_geometry" }
aec_governor = { path = "../aec_governor" }
aec_materials = { path = "../aec_materials" }
aec_viewport = { path = "../aec_viewport" }
chrono = { workspace = true }
glam = { workspace = true }
fastrand = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "0.20"
naga = { version = "0.20", features = ["wgsl-in"] }
pollster = "0.3"

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "native_render"
harness = false

[lints]
workspace = true
