[package]
name = "aec_command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command engine, undo/redo journal, and typed command structs for AEC Studio."

[dependencies]
aec_core = { path = "../aec_core" }
# `aec_ai` is a hard runtime dependency (not dev-only) because the
# `ai_apply` module converts the `Diff` shapes emitted by the AI diff
# engine into typed `Command`s. The crate is intentionally tiny
# (planner + diff engine + audit logger) and has no transitive deps
# on `aec_command`, so pulling it in here doesn't create a cycle.
aec_ai = { path = "../aec_ai" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
aec_audit = { path = "../aec_audit" }
aec_bim = { path = "../aec_bim" }
aec_cad = { path = "../aec_cad" }
aec_export = { path = "../aec_export" }
aec_materials = { path = "../aec_materials" }
aec_render = { path = "../aec_render" }
tempfile = { workspace = true }

[lints]
workspace = true
