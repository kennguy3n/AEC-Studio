[package]
name = "aec_bridge"
version.workspace = true
edition.workspace = true
# napi-derive / napi-build use the `cargo::` directive syntax that was
# introduced in Rust 1.77, so this crate raises its own MSRV above the
# workspace baseline of 1.75. The rest of the workspace stays at 1.75.
rust-version = "1.77"
license.workspace = true
repository.workspace = true
description = "N-API bridge exposing aec_core / aec_command / aec_render to the Electron renderer."
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Bridge ships *without* the N-API symbols by default so `cargo test
# --workspace` doesn't need a Node toolchain. Enable `napi` when packaging
# the desktop app to produce the `.node` artifact.
default = []
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
aec_core = { path = "../aec_core" }
aec_audit = { path = "../aec_audit" }
aec_bim = { path = "../aec_bim" }
aec_cad = { path = "../aec_cad" }
aec_command = { path = "../aec_command" }
rusqlite = { workspace = true }
aec_geometry = { path = "../aec_geometry" }
aec_assets = { path = "../aec_assets" }
aec_render = { path = "../aec_render" }
aec_viewport = { path = "../aec_viewport" }
aec_materials = { path = "../aec_materials" }
uuid = { workspace = true }
aec_governor = { path = "../aec_governor" }
aec_export = { path = "../aec_export" }
aec_ai = { path = "../aec_ai" }
blake3 = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
glam = { workspace = true }

# `tokio_rt` is required so async `#[napi]` functions (e.g. `ai_plan`,
# `bim_import_ifc`) execute on napi-rs's bundled tokio runtime rather
# than the Node main thread. Without it, those calls would freeze the
# Electron main process's JS event loop for the full duration of a
# blocking sidecar HTTP completion (up to 120 s) or a multi-GB IFC
# parse — see the PR-V round-5 follow-up commit for the rationale.
napi = { version = "2", features = ["napi8", "tokio_rt"], optional = true }
napi-derive = { version = "2", optional = true }

[build-dependencies]
napi-build = { version = "2", optional = true }

[dev-dependencies]
aec_cad = { path = "../aec_cad" }
tempfile = { workspace = true }
# `zip` is used by the Phase 13 deliver-pack integration test
# (`tests/phase13_real_context.rs`) to inspect the produced ZIP
# and the embedded OpenXML workbook (which is itself a zip). The
# bridge already depends on `zip` transitively via `aec_export`;
# pulling it into dev-deps gives the integration test a direct
# import without affecting the production dependency surface.
zip = { workspace = true }
# Phase 13 Task 30 — `tests/phase8_journey.rs` authors a real
# on-disk AssetPack extension and computes BLAKE3 of its
# payload bytes (the same digest the loader re-computes for
# `BlobChecksumMismatch` detection) to bake into the manifest.
# The bridge already depends on `blake3` + `hex` transitively
# via `aec_core` and `aec_assets`; pulling them into dev-deps
# gives the journey test direct imports without expanding the
# production dependency surface.
blake3 = { workspace = true }
hex = { workspace = true }
# Phase 13 Task 28 — Criterion bench against the four
# `PROPOSAL.md` acceptance latency targets (cold start, project
# open, DXF import, AI runtime status). Same workspace pin as
# the existing `aec_render` bench so the toolchain stays
# consistent.
criterion = { workspace = true }

[[bench]]
name = "acceptance_criteria"
harness = false

[lints]
workspace = true
