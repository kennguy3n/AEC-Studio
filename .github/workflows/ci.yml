name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Defaults (opened, synchronize, reopened) plus the label events.
    # Adding `test-all-platforms` to an existing PR re-fires the
    # workflow with that label visible in `github.event.pull_request.labels`,
    # so the gate job can flip into the full matrix without the
    # contributor having to push an empty commit or click "Re-run".
    # `unlabeled` is included for symmetry — removing the label
    # snaps the next run back to the Ubuntu-only baseline.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Cancel in-progress PR runs when a new commit / label change
# supersedes them, so a contributor pushing a fixup commit (or
# adding the `test-all-platforms` label after a `synchronize` run
# already started) doesn't burn two parallel runner sets on the
# same PR. Push events on `main` are intentionally NOT cancelled
# — every commit on `main` must produce a CI result for the
# `package-*` gate and release traceability.
#
# `cancel-in-progress` is further gated on the *kind* of new event:
# only `synchronize` / `opened` / `reopened` (the default PR
# actions) and a `labeled`/`unlabeled` on the scope-changing
# `test-all-platforms` label may supersede an in-progress run.
# An unrelated label triage event (e.g. adding `needs-review`)
# must NOT cancel a legitimate run — the gate job's own `if:`
# predicate skips the replacement run for unrelated labels, so an
# unconditional cancel would leave the PR with zero CI results
# until the next push.
#
# The concurrency `group` key intentionally uses `github.sha` on
# push events and `github.ref` on PR events. PR events still
# share a per-branch group so a `synchronize` run supersedes the
# previous one for the same PR. Push events, on the other hand,
# need a per-SHA group: GitHub Actions cancels any *pending*
# (queued) run in the same group when a third run arrives, even
# with `cancel-in-progress: false` (`false` only protects the
# *running* workflow). Without per-SHA isolation, a burst of
# rapid merges to `main` (or a merge queue) would drop the CI
# results for intermediate commits, violating the
# "every commit on `main` must produce a CI result for the
# `package-*` gate and release traceability" invariant.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      github.event_name == 'push' && github.sha || github.ref
    }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && (
          (github.event.action != 'labeled' && github.event.action != 'unlabeled')
          || github.event.label.name == 'test-all-platforms'
        ) }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------
  # gate: compute which OS matrix the rust/typescript jobs should
  # run on for this trigger.
  #
  # Defaults:
  #   * push to main           → full matrix (ubuntu + macos + windows)
  #   * PR with label
  #     `test-all-platforms`   → full matrix
  #   * any other PR           → ubuntu only
  #
  # Rationale: platform-specific CI (especially the Electron-install
  # path on macOS-arm64 and Windows) is occasionally flaky for
  # reasons unrelated to the PR's diff (npm registry / electron CDN
  # 404s, runner image regressions, etc.). For PRs that don't touch
  # platform-specific code (Rust-only, docs-only, etc.) we run a
  # fast and stable baseline — Ubuntu Rust + Ubuntu TypeScript —
  # and gate the full cross-platform sweep on the merge to main,
  # where any real platform regression is caught before it can
  # affect a release.
  #
  # To opt a PR into the full matrix (e.g. when you intentionally
  # touch Electron / packaging / OS-specific Rust code), add the
  # `test-all-platforms` label to the PR.
  # ---------------------------------------------------------------
  gate:
    name: Gate (compute OS matrix)
    runs-on: ubuntu-latest
    # Skip the entire workflow when the trigger is a `labeled` /
    # `unlabeled` event on a label that doesn't change CI scope.
    # `test-all-platforms` flips the matrix; any other label
    # (e.g. `needs-review`, `priority-high`) must not burn runner
    # minutes (the concurrency block above also prevents the
    # replacement run from cancelling an in-progress legitimate
    # run for the same unrelated label event). The first conjunct
    # keeps the default `opened`, `synchronize`, `reopened`, and
    # all `push` events flowing. Explicit parens make the
    # operator precedence (`&&` binds tighter than `||`) visible
    # without having to remember the GitHub Actions expression
    # grammar.
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'test-all-platforms'
    outputs:
      os_matrix: ${{ steps.matrix.outputs.os_matrix }}
    steps:
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          full='["ubuntu-latest","macos-latest","windows-latest"]'
          stable='["ubuntu-latest"]'
          if [ "$EVENT_NAME" = "push" ]; then
            os="$full"
            mode="FULL (push to main)"
          # `$PR_LABELS` is the JSON-encoded array of label names
          # (e.g. `["test-all-platforms","needs-review"]`), so we
          # match the *quoted* form to avoid substring false
          # positives like `no-test-all-platforms-please`.
          elif echo "$PR_LABELS" | grep -qF '"test-all-platforms"'; then
            os="$full"
            mode="FULL (test-all-platforms label)"
          else
            os="$stable"
            mode="STABLE (Ubuntu-only baseline)"
          fi
          echo "Gate decision: $mode"
          echo "os_matrix=$os"
          echo "os_matrix=$os" >> "$GITHUB_OUTPUT"
          # Also surface the decision in the job summary so the run
          # is self-documenting in the GitHub UI without having to
          # drill into step logs.
          {
            echo "### CI gate decision"
            echo
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Mode: **$mode**"
            echo "- OS matrix: \`$os\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust (${{ matrix.os }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gate.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all --no-fail-fast

  libredwg_oracle:
    # Cross-check files written by aec_cad's DwgWriter against
    # LibreDWG's upstream `dwgread` and `dwg2dxf` for every supported
    # AutoCAD version (R12 → R2018). LibreDWG is the de-facto open
    # reference reader; if it opens our files without error and the
    # entity inventory matches what we wrote, we have strong evidence
    # the bit-level encoding is compliant.
    #
    # LibreDWG isn't packaged in Ubuntu, so we build it from source.
    # The build is cached so the steady-state CI run only takes the
    # time to actually invoke `dwgread` on each fixture.
    name: LibreDWG oracle (R12 → R2018)
    needs: gate
    if: needs.gate.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps for LibreDWG
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config swig \
            libpcre2-dev texinfo

      - name: Cache LibreDWG build
        id: libredwg_cache
        uses: actions/cache@v4
        with:
          path: |
            ~/libredwg-install
          key: libredwg-0.13.3-${{ runner.os }}

      - name: Build LibreDWG from source
        if: steps.libredwg_cache.outputs.cache-hit != 'true'
        run: |
          set -e
          cd /tmp
          curl -L https://ftp.gnu.org/gnu/libredwg/libredwg-0.13.3.tar.xz -o libredwg.tar.xz
          tar xJf libredwg.tar.xz
          cd libredwg-0.13.3
          ./configure --disable-bindings \
                      --disable-write \
                      --enable-release \
                      --prefix=$HOME/libredwg-install
          make -j"$(nproc)"
          make install

      - name: Add LibreDWG to PATH
        run: |
          echo "$HOME/libredwg-install/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/libredwg-install/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build fixture emitter
        run: cargo build -p aec_cad --example dwg_oracle_fixture --release

      - name: Emit per-version DWG fixtures
        run: |
          mkdir -p /tmp/dwg_oracle
          ./target/release/examples/dwg_oracle_fixture /tmp/dwg_oracle

      - name: Read each fixture via LibreDWG (dwgread)
        run: |
          set -e
          fail=0
          for v in r12 r14 r2000 r2004 r2007 r2010 r2013 r2018; do
            path=/tmp/dwg_oracle/$v.dwg
            echo "::group::dwgread $v"
            if dwgread --version >/dev/null 2>&1; then
              # The exit code from dwgread is the source of truth.
              # Non-zero means LibreDWG could not parse our file.
              if dwgread -O DXF -o /tmp/dwg_oracle/$v.dxf "$path"; then
                echo "✓ $v.dwg parsed cleanly"
              else
                echo "::error::dwgread refused to read $v.dwg" >&2
                fail=1
              fi
            else
              echo "::warning::dwgread binary missing — skipping $v"
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::At least one fixture failed LibreDWG conformance" >&2
            exit 1
          fi

      - name: Cross-check entity inventory in the emitted DXF
        run: |
          set -e
          # We expect each output DXF to contain LINE, CIRCLE, and
          # TEXT entities (the three the fixture emitter writes).
          # Layered grep is sufficient — anything more sophisticated
          # belongs in a unit test, not the oracle job.
          for v in r12 r14 r2000 r2004 r2007 r2010 r2013 r2018; do
            dxf=/tmp/dwg_oracle/$v.dxf
            if [ ! -f "$dxf" ]; then
              echo "::warning::no DXF for $v (dwgread missing or refused)"
              continue
            fi
            for kind in LINE CIRCLE TEXT; do
              if ! grep -q "^${kind}$" "$dxf"; then
                echo "::error::$v.dxf missing $kind entity" >&2
                exit 1
              fi
            done
            echo "✓ $v: LINE + CIRCLE + TEXT all present"
          done

      - name: Upload oracle artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: libredwg-oracle-failures
          path: /tmp/dwg_oracle/
          retention-days: 7

  typescript:
    name: TypeScript (${{ matrix.os }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gate.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test:ui

  # Phase 9 (PR4 + PR5) removed the `python-workers` job entirely
  # — both the Blender worker and the IFC worker (the only two
  # Python worker trees this repo ever shipped) have been replaced
  # with native Rust implementations. Rendering goes through
  # `crates/aec_render/src/{final_render,walkthrough,panorama}.rs`
  # and IFC I/O / tessellation through `crates/aec_bim/src/ifc/`
  # + `crates/aec_bim/src/tessellator.rs`. Adding a Python step
  # back here would defeat the point of the rewrite.

  # ---------------------------------------------------------------
  # package-*: produce installable artefacts.
  #
  # `needs: [rust, typescript]` gates packaging on a fully green
  # Rust matrix AND a fully green TypeScript matrix — a Rust
  # regression on `main` (e.g. a clippy failure on macOS-latest)
  # must not allow `electron-builder` to ship an installer that
  # links in a broken `aec_bridge` native addon.
  # ---------------------------------------------------------------
  package-linux:
    name: Package (Linux)
    runs-on: ubuntu-latest
    needs: [rust, typescript]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libxss1 libasound2 libnotify4

      # `npm run build` invokes the napi-rs build for the
      # `aec_bridge` native addon, which needs a Rust toolchain on
      # the packaging runner itself (the `rust` job runs on a
      # different machine, its toolchain is not shared). Without
      # this step the Linux installer would either fail at
      # `npm run build` or link in a stale prebuilt addon.
      # Matches the equivalent step in `package-macos` and
      # `package-windows`.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + electron
        run: npm run build

      - name: Install electron-builder
        run: npm install --no-save electron-builder@^24.13.0

      - name: Build AppImage + deb
        working-directory: apps/desktop
        run: |
          npx electron-builder --linux AppImage deb \
            --config ../../packaging/linux/electron-builder.linux.yml

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            apps/desktop/dist/installers/linux/*.AppImage
            apps/desktop/dist/installers/linux/*.deb

  package-macos:
    name: Package (macOS)
    runs-on: macos-latest
    needs: [rust, typescript]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + electron
        run: npm run build

      - name: Install electron-builder
        run: npm install --no-save electron-builder@^24.13.0

      - name: Build dmg + zip
        working-directory: apps/desktop
        env:
          # Skip notarization in CI; signing keys are populated only in
          # release jobs from secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac dmg zip \
            --config ../../packaging/macos/electron-builder.macos.yml

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            apps/desktop/dist/installers/macos/*.dmg
            apps/desktop/dist/installers/macos/*.zip

  package-windows:
    name: Package (Windows)
    runs-on: windows-latest
    needs: [rust, typescript]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + electron
        run: npm run build

      - name: Install electron-builder
        run: npm install --no-save electron-builder@^24.13.0

      - name: Build nsis + msi
        working-directory: apps/desktop
        run: |
          npx electron-builder --win nsis msi `
            --config ../../packaging/windows/electron-builder.windows.yml

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            apps/desktop/dist/installers/windows/*.exe
            apps/desktop/dist/installers/windows/*.msi
