name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------
  # gate: compute which OS matrix the rust/typescript jobs should
  # run on for this trigger.
  #
  # Defaults:
  #   * push to main           → full matrix (ubuntu + macos + windows)
  #   * PR with label
  #     `test-all-platforms`   → full matrix
  #   * any other PR           → ubuntu only
  #
  # Rationale: platform-specific CI (especially the Electron-install
  # path on macOS-arm64 and Windows) is occasionally flaky for
  # reasons unrelated to the PR's diff (npm registry / electron CDN
  # 404s, runner image regressions, etc.). For PRs that don't touch
  # platform-specific code (Rust-only, docs-only, etc.) we run a
  # fast and stable baseline — Ubuntu Rust + Ubuntu TypeScript +
  # Python workers — and gate the full cross-platform sweep on the
  # merge to main, where any real platform regression is caught
  # before it can affect a release.
  #
  # To opt a PR into the full matrix (e.g. when you intentionally
  # touch Electron / packaging / OS-specific Rust code), add the
  # `test-all-platforms` label to the PR.
  # ---------------------------------------------------------------
  gate:
    name: Gate (compute OS matrix)
    runs-on: ubuntu-latest
    outputs:
      os_matrix: ${{ steps.matrix.outputs.os_matrix }}
      full_matrix: ${{ steps.matrix.outputs.full_matrix }}
    steps:
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          full='["ubuntu-latest","macos-latest","windows-latest"]'
          stable='["ubuntu-latest"]'
          if [ "$EVENT_NAME" = "push" ]; then
            os="$full"
            is_full="true"
          elif echo "$PR_LABELS" | grep -q 'test-all-platforms'; then
            os="$full"
            is_full="true"
          else
            os="$stable"
            is_full="false"
          fi
          echo "Computed os_matrix=$os (full=$is_full)"
          echo "os_matrix=$os" >> "$GITHUB_OUTPUT"
          echo "full_matrix=$is_full" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (${{ matrix.os }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gate.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all --no-fail-fast

  typescript:
    name: TypeScript (${{ matrix.os }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gate.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test:ui

  python-workers:
    name: Python workers (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Blender worker tests
        working-directory: workers/blender
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: IFC worker tests
        working-directory: workers/ifc
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  package-linux:
    name: Package (Linux)
    runs-on: ubuntu-latest
    needs: [typescript]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libxss1 libasound2 libnotify4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + electron
        run: npm run build

      - name: Install electron-builder
        run: npm install --no-save electron-builder@^24.13.0

      - name: Build AppImage + deb
        working-directory: apps/desktop
        run: |
          npx electron-builder --linux AppImage deb \
            --config ../../packaging/linux/electron-builder.linux.yml

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            apps/desktop/dist/installers/linux/*.AppImage
            apps/desktop/dist/installers/linux/*.deb

  package-macos:
    name: Package (macOS)
    runs-on: macos-latest
    needs: [typescript]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + electron
        run: npm run build

      - name: Install electron-builder
        run: npm install --no-save electron-builder@^24.13.0

      - name: Build dmg + zip
        working-directory: apps/desktop
        env:
          # Skip notarization in CI; signing keys are populated only in
          # release jobs from secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac dmg zip \
            --config ../../packaging/macos/electron-builder.macos.yml

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            apps/desktop/dist/installers/macos/*.dmg
            apps/desktop/dist/installers/macos/*.zip

  package-windows:
    name: Package (Windows)
    runs-on: windows-latest
    needs: [typescript]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + electron
        run: npm run build

      - name: Install electron-builder
        run: npm install --no-save electron-builder@^24.13.0

      - name: Build nsis + msi
        working-directory: apps/desktop
        run: |
          npx electron-builder --win nsis msi `
            --config ../../packaging/windows/electron-builder.windows.yml

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            apps/desktop/dist/installers/windows/*.exe
            apps/desktop/dist/installers/windows/*.msi
