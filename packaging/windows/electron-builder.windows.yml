# electron-builder config for Windows targets.
#
# All resource paths below are expressed *relative to the project
# directory*, which is `apps/desktop/` (where package.json lives) —
# that's how electron-builder resolves every path in its config. The
# packaging assets themselves live one level up at the repo root, so
# paths use the `../../packaging/windows/...` prefix.
#
# Build the renderer + electron main bundle first (`npm run build` in
# apps/desktop/), then invoke electron-builder from `apps/desktop`:
#
#   cd apps/desktop
#   npx electron-builder --win `
#     --config ../../packaging/windows/electron-builder.windows.yml
#
# or from the repo root with an explicit projectDir:
#
#   npx electron-builder --win `
#     --config packaging/windows/electron-builder.windows.yml `
#     --projectDir apps/desktop
#
# Targets:
# * nsis — single .exe installer, primary distribution form.
# * msi  — Windows Installer package for enterprise deployments.

appId: ai.aec.studio
productName: AEC Studio
copyright: "© 2026 AEC Studio Authors"

directories:
  # Paths are relative to projectDir = apps/desktop.
  buildResources: ../../packaging/windows/resources
  output: dist/installers/windows

files:
  - dist-electron/**
  - dist/**
  - package.json
  - node_modules/**

win:
  publisherName: AEC Studio
  fileAssociations:
    - ext: aec
      name: AEC Studio Project
      description: AEC Studio project file
  protocols:
    - name: AEC Studio
      schemes:
        - aec
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
  icon: ../../packaging/windows/resources/icon.ico
  legalTrademarks: AEC Studio

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AEC Studio
  artifactName: "${productName}-Setup-${version}-${arch}.exe"
  installerIcon: ../../packaging/windows/resources/icon.ico
  uninstallerIcon: ../../packaging/windows/resources/icon.ico

msi:
  oneClick: false
  perMachine: false
  artifactName: "${productName}-${version}-${arch}.msi"

publish: null
